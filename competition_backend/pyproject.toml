[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "su17-competition-backend"
version = "0.2.0"
description = "Six-UAV competition mission orchestration backend"
requires-python = ">=3.8"
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn[standard]>=0.27,<0.31",
  "websockets>=10,<18",
  "numpy>=1.21,<2",
  "shapely>=2.0,<2.1",
]

[project.optional-dependencies]
test = ["httpx>=0.26,<0.28"]

[project.scripts]
competition-backend = "competition_backend.api:run"
su17-competition-backend = "competition_backend.api:run"

[tool.setuptools]
packages = ["competition_backend", "competition_shared"]

[tool.setuptools.package-dir]
competition_shared = "../competition_shared"

[tool.setuptools.package-data]
competition_backend = ["web/*.html", "*.json"]
